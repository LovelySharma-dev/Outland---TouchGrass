<style>
/* ---------------------------------------------------------------------------
   THEME TOKENS. Dark is the default "game/night mode"; light is designed as
   its own palette (paper + ink + forest accent), not a background swap.
   Every component reads only these variables, so both themes are styled by
   construction and no element is left on a stale dark value.
--------------------------------------------------------------------------- */
:root{
  color-scheme:dark;
  --bg:#0e0e10;--bg2:#08080a;--card:#17171b;--card2:#1e1e24;
  --fg:#f4f1ea;--fg2:#d5d2ca;--mu:#9a9aa2;
  --ac:#c6ff3d;--ac-ink:#0e0e10;
  --line:color-mix(in srgb,var(--mu) 34%,transparent);
  --chip:color-mix(in srgb,var(--mu) 46%,transparent);
  --soft:color-mix(in srgb,var(--ac) 12%,transparent);
  --edge:color-mix(in srgb,var(--ac) 55%,transparent);
  --hair:color-mix(in srgb,var(--mu) 40%,transparent);
  --r-common:#9a9aa2;--r-uncommon:#7bd44a;--r-rare:#5ac8fa;--r-epic:#c08cff;--r-legendary:#ffb020;
  --shadow:0 26px 60px rgba(0,0,0,.55);
  --focus:#c6ff3d;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f2efe8;--bg2:#e7e2d6;--card:#ffffff;--card2:#faf8f2;
  --fg:#15151a;--fg2:#35353c;--mu:#57575f;
  --ac:#2b6b00;--ac-ink:#ffffff;
  --line:color-mix(in srgb,var(--mu) 32%,transparent);
  --chip:color-mix(in srgb,var(--mu) 40%,transparent);
  --soft:color-mix(in srgb,var(--ac) 9%,#ffffff);
  --edge:color-mix(in srgb,var(--ac) 45%,transparent);
  --hair:color-mix(in srgb,var(--mu) 30%,transparent);
  --r-common:#5c5c62;--r-uncommon:#2b6b00;--r-rare:#0b5e9e;--r-epic:#6b21c8;--r-legendary:#8a5a00;
  --shadow:0 16px 38px rgba(35,32,20,.12);
  --focus:#2b6b00;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--fg);font:16px system-ui,sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 20px 40px;
  background:
    radial-gradient(1100px 560px at 50% -12%,color-mix(in srgb,var(--ac) 12%,transparent),transparent 68%),
    radial-gradient(760px 460px at 104% 102%,color-mix(in srgb,var(--ac) 6%,transparent),transparent 70%),
    var(--bg);
  background-attachment:fixed;
}

.maps{display:inline-flex;align-items:center;gap:6px;margin-top:11px;padding:9px 14px;border:1px solid var(--ac);border-radius:12px;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--ac);transition:background .15s,color .15s,transform .15s}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.cta{display:flex;flex-direction:column;gap:10px;margin-top:18px}

.q ol li{animation:rise .4s both}.q ol li:nth-child(2){animation-delay:.08s}.q ol li:nth-child(3){animation-delay:.16s}.q ol li:nth-child(4){animation-delay:.24s}.q ol li:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* GSAP takes over the quest card when it is available; the CSS keyframes are
   disabled for those elements so nothing animates twice. */
.gsap .q,.gsap .q .qtitle,.gsap .q ol li,.gsap .q .place{animation:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){.q{padding:18px 15px 16px}.stats{gap:6px}.place{gap:10px}}

<script id="theme-boot">
/* Blocking theme bootstrap. Runs before <body> is parsed so the correct theme
   is on <html> before first paint - no flash of the wrong theme. Order:
   saved preference > system preference > dark (the game/night default). */
(function () {
  var KEY = "outland-theme";
  function read() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function system() {
    return (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
  }
  function valid(t) { return t === "light" || t === "dark"; }
  function apply(t, save) {
    if (!valid(t)) return;
    var el = document.documentElement;
    el.setAttribute("data-theme", t);
    el.style.colorScheme = t;
    if (save) { try { localStorage.setItem(KEY, t); } catch (e) {} }
    var tc = document.getElementById("tc");
    if (tc) tc.setAttribute("content", t === "light" ? "#f2efe8" : "#0e0e10");
    try { document.dispatchEvent(new CustomEvent("outland:theme", { detail: t })); } catch (e) {}
  }
  var saved = read();
  apply(valid(saved) ? saved : system(), false);
  window.__setTheme = apply;
  window.__THEME_KEY__ = KEY;
  /* No saved preference: follow the OS live, so the toggle-less state always
     tracks the system. Once the user picks a theme the listener goes quiet. */
  if (window.matchMedia && matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: light)");
    var onChange = function () { if (!valid(read())) apply(mq.matches ? "light" : "dark", false); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
})();
</script>

<header class="top">

<script id="outland-card">
/* Pure view layer: builds the quest card markup and touches no DOM, so the
   player-facing card can be tested directly (location rules, map link rules,
   hierarchy) without a browser. */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// A map link is only ever built from a URL the server already grounded: it has
// to be an absolute google.com/maps URL. Anything else (a missing field, a
// relative path, something invented upstream) renders the place name with no
// navigation affordance rather than a link that promises more than we have.
const mapLink = (u) => (typeof u === "string" && /^https:\/\/www\.google\.com\/maps\//.test(u)) ? u : "";

function cardHTML({ quest: q, source, trace, latency_ms, provider, fallback }) {
  const r = String(q.rarity || "COMMON").toLowerCase();
  const pl = q.location && q.location.name ? q.location : null;
  const maps = pl ? mapLink(pl.map_url) : "";
  const via = pl ? (pl.via || "gemma") : "";
  const reason = pl ? (pl.reason || "Your side quest happens here.") : "";
  const place = pl ? (maps
    ? `<a class="place" data-via="${esc(via)}" href="${esc(maps)}" target="_blank" rel="noopener noreferrer"><span class="pin" aria-hidden="true">📍</span><span class="pbody"><span class="plabel">location</span><b>${esc(pl.name)}</b><small>${esc(reason)}</small><span class="maps">OPEN IN MAPS ↗</span></span></a>`
    : `<div class="place" role="group" aria-label="Quest location" data-via="${esc(via)}"><span class="pin" aria-hidden="true">📍</span><span class="pbody"><span class="plabel">location</span><b>${esc(pl.name)}</b><small>${esc(reason)}</small></span></div>`) : "";
  return `<div class="q">
 <div class="accepted">QUEST ACCEPTED</div>
 <div class="rline"><span class="rarity r-${esc(r)}">${esc(q.rarity)}</span><span class="cat">${esc(q.category)}</span></div>
 <h1 class="qtitle" tabindex="-1">${esc(q.title)}</h1>
 <p class="hook">${esc(q.hook)}</p>
 ${place}
 <div class="stats"><span><b>+${q.xp} XP</b></span><span>${Math.round(q.duration_minutes)} min</span><span>₹${q.budget}</span><span>${esc(q.difficulty)}</span></div>
 <p class="obj"><small>objective</small>${esc(q.objective)}</p>
 <ol>${q.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
 ${q.bonus_objective ? `<div class="bonus"><b>BONUS XP · OPTIONAL BONUS</b>${esc(q.bonus_objective)}</div>` : ""}
 ${q.secret_objective ? `<button class="secret" id="sec">??? SECRET OBJECTIVE</button><div class="bonus secbox" id="secbox" hidden><b>SECRET · BONUS XP</b><span>${esc(q.secret_objective)}</span></div>` : ""}
 <div class="done"><small>done when</small>${esc(q.done_when)}</div>
 <p class="safe">⚠ ${esc((q.safety || []).join(" "))}</p>
 <div class="cta"><button class="go" id="again">NEW QUEST · SAME SETTINGS</button><button class="ghost" id="change">CHANGE ANSWERS</button></div>
 <details><summary><small>pipeline trace · ${esc(provider || "curated")} · ${esc(source)}${fallback ? " · fallback: " + esc(fallback.reason) : ""} · ${latency_ms}ms</small></summary><pre>${esc(JSON.stringify(trace, null, 1))}</pre></details></div>`;
}
</script>
<script>
const S={state:null,energy:null,budget:null,social:null,chaos:null,city:"",excuse:""};
const mood=[["rotting","🫠 I've been rotting in bed"],["scrolling","📱 I've been scrolling for 3 hours"],["leave-room","🧍 I need to leave my room"],["tabs","😵‍💫 my brain has 47 tabs open"],["low-battery","🥱 low battery human"],["side-quest","🔥 I need a side quest"],["new-sight","👀 I want to see something I've never seen"],["disappear","🌚 I need to disappear for a bit"],["dunno","💀 I don't know, just get me out"],["main-character","✨ main character moment"],["surprise","🎲 SURPRISE ME"]];
const en=[[10,"10% — I can barely leave my building."],[30,"30% — Give me a reason to walk."],[50,"50% — I'm willing to explore."],[80,"80% — Take me somewhere."],[100,"100% — Give me a quest."]];
const bu=[[0,"🪦 Financially deceased"],[50,"🪙 Found ₹37 in my pocket"],[200,"💳 I can spend a little"],[500,"🤑 Today's not about money"]];
const so=[["solo","🧍 Just me"],["yapper","👯 Me + my yapper"],["group","🫂 The group chat actually showed up"],["dog","🐕 Me + my dog"],["meet-humans","🕵️ I want to meet humans"],["secret","🥷 Nobody needs to know where I went"]];
const ch=[[1,"1 — NORMAL"],[2,"2 — SLIGHTLY UNHINGED"],[3,"3 — SIDE QUEST"],[4,"4 — MAIN CHARACTER"],[5,"5 — TOUCH GRASS FINAL BOSS"]];
const v=document.getElementById("v"),p=document.getElementById("p");
const opts=(list,key,onpick)=>list.map(([val,l])=>`<button data-k="${key}" data-v="${val}" aria-pressed="${S[key]==val}">${esc(l)}</button>`).join("");

/* --- theme toggle ------------------------------------------------------- */
const tbtn=document.getElementById("theme");
function paintTheme(){
  const t=document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";
  tbtn.innerHTML=`<span class="tti" aria-hidden="true">${t==="dark"?"☾":"☀"}</span><span class="ttl">${t==="dark"?"Dark":"Light"}</span>`;
  tbtn.setAttribute("aria-label", t==="dark" ? "Dark theme — switch to light" : "Light theme — switch to dark");
}
tbtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
  window.__setTheme(cur,true);
  paintTheme();
});
document.addEventListener("outland:theme",paintTheme);
paintTheme();
window.setTheme=(t,save)=>{window.__setTheme(t,save!==false);paintTheme()};

/* --- motion: GSAP when it loaded, CSS keyframes otherwise --------------- */
const reducedMotion=()=>!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
function motionCard(){
  const g=window.gsap;
  if(!g||reducedMotion())return;
  document.documentElement.classList.add("gsap");
  const q=document.querySelector(".q");
  if(!q)return;
  const tl=g.timeline({defaults:{ease:"power3.out"}});
  tl.from(".q .accepted",{y:-10,opacity:0,duration:.35})
    .from(".q .rline",{y:10,opacity:0,duration:.35},"-=.18")
    .from(".q .qtitle",{y:18,opacity:0,duration:.45},"-=.22")
    .from(".q .hook",{y:12,opacity:0,duration:.4},"-=.26");
  if(q.querySelector(".place")) tl.from(".q .place",{y:16,opacity:0,duration:.45},"-=.22");
  tl.from(".q .stats span",{y:8,opacity:0,duration:.3,stagger:.05},"-=.18");
  // Scroll reveal for everything below the fold. Only selectors that are
  // actually on this card are handed to ScrollTrigger, so an optional block
  // (bonus, secret) never leaves an invisible target behind.
  if(window.ScrollTrigger){
    g.registerPlugin(window.ScrollTrigger);
    const lower=[".q .obj",".q ol li",".q .bonus",".q .secret",".q .done",".q .safe"].filter(s=>q.querySelector(s));
    if(lower.length) g.from(lower.join(","),{
      y:16,opacity:0,duration:.45,stagger:.05,ease:"power2.out",
      scrollTrigger:{trigger:".q",start:"top 82%",once:true}
    });
  }
}

function s0(){p.style.width="0";v.innerHTML=`<div class="hero"><div class="tag">stop scrolling. start questing.</div><h1 class="wordmark">OUT<em>LAND</em></h1><p class="lead">your neighborhood has side quests.</p><p class="welcome"><b>Welcome to Outland.</b>Your couch has had enough. 💀</p><button class="go" id="start">GENERATE MY QUEST →</button><div class="meta"><span>≈ 60 sec quiz</span><span>real places</span><span>zero doomscrolling</span></div></div>`}
const focusH=()=>{const h=v.querySelector("h1[tabindex]");if(h)h.focus()};
function s1(){p.style.width="15%";v.innerHTML=`<div class="tag">your neighborhood has side quests.</div><h1 tabindex="-1">what's your excuse today?</h1><div class="g">${opts(mood,"state")}</div><p class="hint"><small>got an excuse? say it in your own words (optional)</small><br><input id="excuse" aria-label="your excuse" maxlength="200" placeholder="e.g. I've been studying all day and my brain is fried" value="${esc(S.excuse)}"></p>`;focusH()}
function s2(){p.style.width="50%";const ready=S.energy!=null&&S.budget!=null&&S.social;v.innerHTML=`<h1 tabindex="-1">how much IRL DLC do you have?</h1><div class="g">${opts(en,"energy")}</div><p><small>budget</small></p><div class="row">${opts(bu,"budget")}</div><p><small>who's coming</small></p><div class="row">${opts(so,"social")}</div><p><small>city (optional, for real places)</small><br><input id="city" aria-label="city" placeholder="e.g. Ghaziabad" autocomplete="address-level2" value="${esc(S.city)}"></p><button class="go" id="n2" ${ready?"":"disabled"}>NEXT →</button>`;focusH()}
function s3(){p.style.width="80%";v.innerHTML=`<h1 tabindex="-1">how unhinged are we allowed to get?</h1><div class="g">${opts(ch,"chaos")}</div><button class="go" id="gen" ${S.chaos==null?"disabled":""}>GENERATE MY QUEST →</button>`;focusH()}
v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){const k=b.dataset.k;S[k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  b.parentElement.querySelectorAll(`[data-k=${k}]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
   if(k==="state"){const ex=document.getElementById("excuse");if(ex)S.excuse=ex.value.trim().slice(0,200);return setTimeout(s2,180);}
  if(k==="chaos")document.getElementById("gen").disabled=false;
  const n=document.getElementById("n2");if(n)n.disabled=!(S.energy!=null&&S.budget!=null&&S.social)}
 else if(b.id==="start")s1();
 else if(b.id==="n2"){S.city=document.getElementById("city").value;s3()}
 else if(b.id==="gen"||b.id==="again")gen();else if(b.id==="change")s1()});
let ticker=null;
async function gen(){const t0=Date.now();if(ticker)clearInterval(ticker);
 p.style.width="18%";
 v.innerHTML=`<div class="tag">OUTLAND · GEMMA</div><h1 tabindex="-1">your neighborhood is writing a side quest…</h1><div class="load"><span class="secs" id="el">0s</span><small>elapsed · normally well under 15s</small></div><span class="stage" id="stage">state → discovery → gemma → safety gate → quality gate → personalization → quest</span>`;focusH();
 ticker=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);const el=document.getElementById("el");if(el)el.textContent=s+"s";p.style.width=Math.min(95,18+s*6)+"%"},250);
 try{const r=await fetch("/api/quest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
  const body=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(r.status===400?"one of your answers didn't save — please try again":r.status===503?"outland has nothing safe to serve right now — try changing your answers":(body&&body.error)||("server said "+r.status));
  show(body)}
 catch(e){if(ticker){clearInterval(ticker);ticker=null}p.style.width="100%";
  v.innerHTML=`<div class="tag">OUTLAND · ERROR</div><h1 tabindex="-1">quest failed to spawn</h1><p>${esc(e.message)}</p><div class="cta"><button class="go" id="gen">TRY AGAIN</button><button class="ghost" id="change">CHANGE ANSWERS</button></div>`;focusH()}}
function show(payload){if(ticker){clearInterval(ticker);ticker=null}p.style.width="100%";
 v.innerHTML=cardHTML(payload);
 focusH();
 const sec=document.getElementById("sec");
 if(sec)sec.addEventListener("click",()=>{document.getElementById("secbox").hidden=false;sec.remove()});
 motionCard();
}
s0();
</script></body></html>
