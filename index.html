<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="OUTLAND — your neighborhood has side quests. AI-generated real-world quests that get you off the couch."><meta name="theme-color" content="#0e0e10"><meta property="og:type" content="website"><meta property="og:title" content="OUTLAND · your neighborhood has side quests."><meta property="og:description" content="Stop scrolling. Start questing. Your couch has had enough."><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e0e10'/><path d='M32 12 44 46 32 39 20 46Z' fill='%23c6ff3d'/></svg>"><title>OUTLAND · your neighborhood has side quests.</title>
<style>
:root{--bg:#0e0e10;--fg:#f4f1ea;--ac:#c6ff3d;--mu:#8a8a90}
@media(prefers-color-scheme:light){:root{--bg:#f4f1ea;--fg:#111;--ac:#2b6b00;--mu:#5c5c62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 20px 40px}
main{max-width:520px;margin:0 auto}h1{font-size:clamp(34px,9vw,56px);line-height:1;margin:28px 0 20px;letter-spacing:-.03em}
.brand{font-weight:800;letter-spacing:.35em;color:var(--ac);font-size:13px;margin-bottom:6px}.tag{letter-spacing:.18em;font-size:13px;color:var(--mu);text-transform:uppercase}
.g{display:grid;gap:10px}button{font:inherit;color:inherit;background:transparent;border:2px solid var(--mu);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
button:hover{border-color:var(--ac)}button:focus-visible,summary:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}button:active{transform:scale(.97)}button[aria-pressed=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
.go{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:800;text-align:center;margin-top:18px;width:100%}.go:disabled{opacity:.45;cursor:not-allowed}.go:not(:disabled):hover{filter:brightness(1.06)}small{color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px}.row button{padding:10px 14px}.q{animation:r .6s cubic-bezier(.2,1.4,.4,1)}@keyframes r{from{opacity:0;transform:translateY(30px) scale(.95)}}
.bar{height:4px;background:var(--mu);border-radius:4px;margin-bottom:24px}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
pre{white-space:pre-wrap;font-size:12px;color:var(--mu)}
.wordmark{font-size:clamp(48px,16vw,88px);font-weight:800;letter-spacing:-.045em;line-height:.9;margin:30px 0 14px}
.wordmark em{font-style:normal;color:var(--ac);text-shadow:0 0 34px color-mix(in srgb,var(--ac) 45%,transparent)}
.lead{font-size:clamp(17px,4.6vw,21px);letter-spacing:-.01em;margin:0 0 18px}
.welcome{border-left:3px solid var(--ac);padding-left:14px;margin:0;font-size:15px;line-height:1.5;color:var(--fg)}
.welcome b{display:block;letter-spacing:-.01em}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.meta span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.hint{margin-top:14px}input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--mu);background:transparent;color:inherit;font:inherit}input:focus-visible{border-color:var(--ac)}
footer{margin-top:44px;padding-top:18px;border-top:1px solid color-mix(in srgb,var(--mu) 40%,transparent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
footer b{color:var(--ac);font-weight:800}
.accepted{display:inline-block;font-size:11px;letter-spacing:.3em;font-weight:800;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:999px;padding:6px 13px;margin-bottom:14px}
.rline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rarity{font-size:11px;letter-spacing:.18em;font-weight:800;padding:4px 10px;border-radius:8px;border:1px solid currentColor}
.r-common{color:#9a9aa2}.r-uncommon{color:#7bd44a}.r-rare{color:#5ac8fa}.r-epic{color:#c08cff}.r-legendary{color:#ffb020}
@media(prefers-color-scheme:light){.r-common{color:#5c5c62}.r-uncommon{color:#2b6b00}.r-rare{color:#0b5e9e}.r-epic{color:#6b21c8}.r-legendary{color:#8a5a00}}
.cat{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.qtitle{font-size:clamp(30px,8vw,46px);line-height:1.02;letter-spacing:-.03em;margin:8px 0 12px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.hook{font-size:17px;line-height:1.45;margin:0 0 16px;border-left:3px solid var(--ac);padding-left:12px;opacity:.92}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.stats span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid color-mix(in srgb,var(--mu) 45%,transparent);border-radius:10px;padding:6px 10px;color:var(--mu)}
.stats b{color:var(--ac)}
.obj small,.done small,.secbox small{display:block;font-size:10px;letter-spacing:.22em;color:var(--mu);text-transform:uppercase;margin-bottom:5px}
.obj{font-size:15px;line-height:1.5;margin:0 0 14px}
ol{padding-left:20px;line-height:1.55;margin:0 0 6px}ol li{margin-bottom:9px}ol li::marker{color:var(--ac);font-weight:800}
.bonus{margin-top:12px;border:1px dashed color-mix(in srgb,var(--ac) 60%,transparent);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.bonus b{display:block;color:var(--ac);font-size:10px;letter-spacing:.2em;margin-bottom:5px}
.secret{width:100%;margin-top:10px;text-align:center;font-weight:800;letter-spacing:.14em;font-size:12px;border-style:dashed;text-transform:uppercase}
.done{margin-top:16px;background:color-mix(in srgb,var(--ac) 10%,transparent);border-radius:14px;padding:13px 15px;font-size:15px;line-height:1.45}
.place{display:flex;gap:11px;align-items:flex-start;margin:0 0 16px;background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:14px;padding:13px 15px;animation:rise .4s both}
.place .pin{font-size:19px;line-height:1.15}
.place b{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.place small{display:block;font-size:12px;color:var(--mu);margin-top:4px;letter-spacing:.02em}
.place a{display:inline-block;margin-top:10px;padding:7px 12px;border:1px solid color-mix(in srgb,var(--ac) 60%,transparent);border-radius:10px;font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--ac);text-decoration:none}
.place a:hover{background:var(--ac);color:var(--bg)}
.safe{margin-top:12px;font-size:12px;color:var(--mu);line-height:1.5}
h1:focus{outline:none}
.load{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.load .secs{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ac);letter-spacing:.06em}
.stage{display:block;margin-top:16px;font-size:13px;color:var(--mu);letter-spacing:.06em}
details{margin-top:16px}
.secbox{animation:rise .3s both}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.cta .go{margin-top:0}
.ghost{background:transparent;color:var(--fg);border-color:var(--mu);font-weight:700;text-align:center;width:100%;margin-top:0}
.ghost:hover{border-color:var(--ac)}
.q ol li{animation:rise .4s both}.q ol li:nth-child(2){animation-delay:.08s}.q ol li:nth-child(3){animation-delay:.16s}.q ol li:nth-child(4){animation-delay:.24s}.q ol li:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
details summary{cursor:pointer}details pre{margin-top:8px;max-height:340px;overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main><div class="brand">OUTLAND</div><div class="bar"><i id="p"></i></div><div id="v" aria-live="polite"></div><footer><b>OUTLAND</b> · your neighborhood has side quests.</footer></main>
<script>
const S={state:null,energy:null,budget:null,social:null,chaos:null,city:"",excuse:""};
const mood=[["rotting","🫠 I've been rotting in bed"],["scrolling","📱 I've been scrolling for 3 hours"],["leave-room","🧍 I need to leave my room"],["tabs","😵‍💫 my brain has 47 tabs open"],["low-battery","🥱 low battery human"],["side-quest","🔥 I need a side quest"],["new-sight","👀 I want to see something I've never seen"],["disappear","🌚 I need to disappear for a bit"],["dunno","💀 I don't know, just get me out"],["main-character","✨ main character moment"],["surprise","🎲 SURPRISE ME"]];
const en=[[10,"10% — I can barely leave my building."],[30,"30% — Give me a reason to walk."],[50,"50% — I'm willing to explore."],[80,"80% — Take me somewhere."],[100,"100% — Give me a quest."]];
const bu=[[0,"🪦 Financially deceased"],[50,"🪙 Found ₹37 in my pocket"],[200,"💳 I can spend a little"],[500,"🤑 Today's not about money"]];
const so=[["solo","🧍 Just me"],["yapper","👯 Me + my yapper"],["group","🫂 The group chat actually showed up"],["dog","🐕 Me + my dog"],["meet-humans","🕵️ I want to meet humans"],["secret","🥷 Nobody needs to know where I went"]];
const ch=[[1,"1 — NORMAL"],[2,"2 — SLIGHTLY UNHINGED"],[3,"3 — SIDE QUEST"],[4,"4 — MAIN CHARACTER"],[5,"5 — TOUCH GRASS FINAL BOSS"]];
const v=document.getElementById("v"),p=document.getElementById("p");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts=(list,key,onpick)=>list.map(([val,l])=>`<button data-k="${key}" data-v="${val}" aria-pressed="${S[key]==val}">${esc(l)}</button>`).join("");
function s0(){p.style.width="0";v.innerHTML=`<div class="hero"><div class="tag">stop scrolling. start questing.</div><h1 class="wordmark">OUT<em>LAND</em></h1><p class="lead">your neighborhood has side quests.</p><p class="welcome"><b>Welcome to Outland.</b>Your couch has had enough. 💀</p><button class="go" id="start">GENERATE MY QUEST →</button><div class="meta"><span>≈ 60 sec quiz</span><span>real places</span><span>zero doomscrolling</span></div></div>`}
const focusH=()=>{const h=v.querySelector("h1[tabindex]");if(h)h.focus()};
function s1(){p.style.width="15%";v.innerHTML=`<div class="tag">your neighborhood has side quests.</div><h1 tabindex="-1">what's your excuse today?</h1><div class="g">${opts(mood,"state")}</div><p class="hint"><small>got an excuse? say it in your own words (optional)</small><br><input id="excuse" aria-label="your excuse" maxlength="200" placeholder="e.g. I've been studying all day and my brain is fried" value="${esc(S.excuse)}"></p>`;focusH()}
function s2(){p.style.width="50%";const ready=S.energy!=null&&S.budget!=null&&S.social;v.innerHTML=`<h1 tabindex="-1">how much IRL DLC do you have?</h1><div class="g">${opts(en,"energy")}</div><p><small>budget</small></p><div class="row">${opts(bu,"budget")}</div><p><small>who's coming</small></p><div class="row">${opts(so,"social")}</div><p><small>city (optional, for real places)</small><br><input id="city" aria-label="city" placeholder="e.g. Ghaziabad" autocomplete="address-level2" value="${esc(S.city)}"></p><button class="go" id="n2" ${ready?"":"disabled"}>NEXT →</button>`;focusH()}
function s3(){p.style.width="80%";v.innerHTML=`<h1 tabindex="-1">how unhinged are we allowed to get?</h1><div class="g">${opts(ch,"chaos")}</div><button class="go" id="gen" ${S.chaos==null?"disabled":""}>GENERATE MY QUEST →</button>`;focusH()}
v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){const k=b.dataset.k;S[k]=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  b.parentElement.querySelectorAll(`[data-k=${k}]`).forEach(x=>x.setAttribute("aria-pressed",x===b));
   if(k==="state"){const ex=document.getElementById("excuse");if(ex)S.excuse=ex.value.trim().slice(0,200);return setTimeout(s2,180);}
  if(k==="chaos")document.getElementById("gen").disabled=false;
  const n=document.getElementById("n2");if(n)n.disabled=!(S.energy!=null&&S.budget!=null&&S.social)}
 else if(b.id==="start")s1();
 else if(b.id==="n2"){S.city=document.getElementById("city").value;s3()}
 else if(b.id==="gen"||b.id==="again")gen();else if(b.id==="change")s1()});
let ticker=null;
async function gen(){const t0=Date.now();if(ticker)clearInterval(ticker);
 p.style.width="18%";
 v.innerHTML=`<div class="tag">OUTLAND · GEMMA</div><h1 tabindex="-1">your neighborhood is writing a side quest…</h1><div class="load"><span class="secs" id="el">0s</span><small>elapsed · normally well under 15s</small></div><span class="stage" id="stage">state → discovery → gemma → safety gate → quality gate → personalization → quest</span>`;focusH();
 ticker=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);const el=document.getElementById("el");if(el)el.textContent=s+"s";p.style.width=Math.min(95,18+s*6)+"%"},250);
 try{const r=await fetch("/api/quest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
  const body=await r.json().catch(()=>null);
  if(!r.ok)throw new Error(r.status===400?"one of your answers didn't save — please try again":r.status===503?"outland has nothing safe to serve right now — try changing your answers":(body&&body.error)||("server said "+r.status));
  show(body)}
 catch(e){if(ticker){clearInterval(ticker);ticker=null}p.style.width="100%";
  v.innerHTML=`<div class="tag">OUTLAND · ERROR</div><h1 tabindex="-1">quest failed to spawn</h1><p>${esc(e.message)}</p><div class="cta"><button class="go" id="gen">TRY AGAIN</button><button class="ghost" id="change">CHANGE ANSWERS</button></div>`;focusH()}}
function show({quest:q,source,trace,latency_ms,provider,fallback}){if(ticker){clearInterval(ticker);ticker=null}p.style.width="100%";
 const r=String(q.rarity||"COMMON").toLowerCase();
 const pl=q.location&&q.location.name?q.location:null;
 const maps=pl&&typeof pl.map_url==="string"&&/^https:\/\/www\.google\.com\/maps\//.test(pl.map_url)?pl.map_url:"";
 v.innerHTML=`<div class="q"><div class="accepted">QUEST ACCEPTED</div>
 ${pl?`<div class="place"><span class="pin" aria-hidden="true">📍</span><div><b>${esc(pl.name)}</b><small>Your side quest happens here.</small>${maps?`<a href="${esc(maps)}" target="_blank" rel="noopener noreferrer">OPEN IN MAPS ↗</a>`:""}</div></div>`:""}
 <div class="rline"><span class="rarity r-${esc(r)}">${esc(q.rarity)}</span><span class="cat">${esc(q.category)}</span></div>
 <h1 class="qtitle" tabindex="-1">${esc(q.title)}</h1>
 <p class="hook">${esc(q.hook)}</p>
 <div class="stats"><span><b>+${q.xp} XP</b></span><span>${Math.round(q.duration_minutes)} min</span><span>₹${q.budget}</span><span>${esc(q.difficulty)}</span></div>
 <p class="obj"><small>objective</small>${esc(q.objective)}</p>
 <ol>${q.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
 ${q.bonus_objective?`<div class="bonus"><b>BONUS XP · OPTIONAL BONUS</b>${esc(q.bonus_objective)}</div>`:""}
 ${q.secret_objective?`<button class="secret" id="sec">??? SECRET OBJECTIVE</button><div class="bonus secbox" id="secbox" hidden><b>SECRET · BONUS XP</b><span>${esc(q.secret_objective)}</span></div>`:""}
 <div class="done"><small>done when</small>${esc(q.done_when)}</div>
 <p class="safe">⚠ ${esc((q.safety||[]).join(" "))}</p>
 <div class="cta"><button class="go" id="again">NEW QUEST · SAME SETTINGS</button><button class="ghost" id="change">CHANGE ANSWERS</button></div>
 <details><summary><small>pipeline trace · ${esc(provider||"curated")} · ${esc(source)}${fallback?" · fallback: "+esc(fallback.reason):""} · ${latency_ms}ms</small></summary><pre>${esc(JSON.stringify(trace,null,1))}</pre></details></div>`;
 focusH();
 const sec=document.getElementById("sec");
 if(sec)sec.addEventListener("click",()=>{document.getElementById("secbox").hidden=false;sec.remove()});
}
s0();
</script></body></html>
