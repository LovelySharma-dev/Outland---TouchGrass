services:
  - type: web
    name: outland
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GEMMA_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
